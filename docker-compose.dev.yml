services:
  postgres:
    image: postgres:16-alpine
    container_name: xlt-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_db}
      POSTGRES_USER: ${POSTGRES_USER:-delivery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery_user} -d ${POSTGRES_DB:-delivery_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xlt-redis-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: xlt-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-delivery_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change_me}
      FIRST_RUN_SETUP_ENABLED: ${FIRST_RUN_SETUP_ENABLED:-true}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
    container_name: xlt-web-admin-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WEB_ADMIN_PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:${WEB_ADMIN_PORT:-3001}:3001"
    depends_on:
      - api

volumes:
  postgres_dev_data:
  redis_dev_data:
