plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
}

react {
    autolinkLibrariesWithApp()
}

def jscFlavor = 'org.webkit:android-jsc:+'
def mobileApiBaseUrl = System.getenv('MOBILE_API_BASE_URL') ?: System.getenv('API_BASE_URL') ?: ''
def escapedMobileApiBaseUrl = mobileApiBaseUrl.replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace "com.xlt.delivery"
    compileSdk 35

    defaultConfig {
        applicationId "com.xlt.delivery"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "MOBILE_API_BASE_URL", "\"${escapedMobileApiBaseUrl}\""
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        standalone {
            initWith release
            matchingFallbacks = ["release"]
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.appcompat:appcompat:1.6.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
